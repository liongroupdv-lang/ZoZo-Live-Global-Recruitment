services:
  - type: web
    name: zozo-live-global-recruitment
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22.20.0"
      - key: OWNER_EMAIL
        value: liongroupdv@gmail.com
      - key: APP_URL
        value: https://zozo-live-global-recruitment.onrender.com
